name: tool-snapshots (GraalVM native-image of kotlinc/R8/D8 + acs bundle)

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Tools to snapshot (comma: d8,r8,kotlinc)'
        required: true
        default: 'd8,r8'
      acs_ref:
        description: 'acs git ref to build into the bundle (branch/tag/sha)'
        required: true
        default: 'main'
      kotlin_version:
        description: 'Kotlin release tag (e.g. v2.2.20)'
        required: true
        default: 'v2.2.20'
      r8_version:
        description: 'R8 version from Google Maven (e.g. 8.13.23)'
        required: true
        default: '8.13.23'
      release_tag:
        description: 'Release tag to publish to (default: snapshots-<run number>)'
        required: false
        default: ''

# Binaries are published as RELEASE ASSETS, not workflow artifacts. Actions
# artifact storage is a small account-wide quota (500 MB on the Free plan) that
# this repo does not control; release assets are not metered by it. The release
# also outlives the 7-day artifact retention, which is what install-local.sh
# wants anyway.
permissions:
  contents: write

jobs:
  release:
    name: create release
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="snapshots-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            # Created as a prerelease; `finalize` promotes it to latest only when
            # every requested job succeeded, so install-local's "latest stable"
            # lookup can never pick a half-finished run.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "tool snapshots $TAG" --prerelease \
              --notes "d8/r8/kotlinc native-image snapshots + acs. Auto-published by workflow run ${{ github.run_number }}."
          fi

  snapshot:
    name: snapshot ${{ matrix.tool }} (arm64)
    needs: release
    strategy:
      fail-fast: false
      matrix:
        tool: [d8, r8, kotlinc]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Filter by inputs
        id: gate
        run: |
          if [[ ",${{ inputs.tools }}," == *",${{ matrix.tool }},"* ]]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GraalVM JDK 25 (latest)
        if: steps.gate.outputs.run == 'yes'
        uses: graalvm/setup-graalvm@v1
        with:
          # Track the latest GraalVM (JDK 25 line). The old JDK 21 pin
          # (GraalVM 21.0.2 / jvmci-23.1) produced native images whose
          # filesystem-provider handling broke D8 on real Compose input
          # ("Provider \"jar\" not found"); JDK 25 is the known-good line.
          java-version: '25'
          distribution: 'graalvm-community'

      - name: Setup Gradle (artifact fetching only, no build plugins run)
        if: steps.gate.outputs.run == 'yes'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK (D8/R8 tracing needs android.jar)
        if: steps.gate.outputs.run == 'yes'
        uses: android-actions/setup-android@v3
        with:
          # NB: the action's default package list includes the long-removed
          # "tools" package, which makes sdkmanager exit 1. List only what
          # exists; the platform install below uses sdkmanager directly.
          packages: platform-tools

      - name: Install SDK platform for tracing
        if: steps.gate.outputs.run == 'yes'
        run: |
          # setup-android does not put sdkmanager on PATH; locate it under
          # ANDROID_HOME (ANDROID_SDK_ROOT is the same dir) defensively.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path "*cmdline-tools*/bin/sdkmanager" 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKM"
          "$SDKM" "platforms;android-35"

      - name: Trace + link + smoke-test
        if: steps.gate.outputs.run == 'yes'
        env:
          TOOL: ${{ matrix.tool }}
          KOTLIN_TAG: ${{ inputs.kotlin_version }}
          R8_VERSION: ${{ inputs.r8_version }}
        run: bash scripts/snapshot.sh

      # `out/` holds the binary and its <tool>-snapshot-meta/ directory; tar them
      # together so one release asset carries both.
      - name: Package + publish snapshot
        if: steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "${{ matrix.tool }}-snapshot-arm64.tar.gz" -C out .
          gh release upload "${{ needs.release.outputs.tag }}" \
            "${{ matrix.tool }}-snapshot-arm64.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # acs: the build tool itself, cross-repo. acs is pure Rust (no build.rs, no
  # native deps), so a stock nightly toolchain is the only requirement. Its
  # `--snapshot` mode resolves d8-snapshot / r8-snapshot from a shared dir; the
  # `bundle` job puts all three binaries side by side.
  # ---------------------------------------------------------------------------
  acs:
    name: build acs (arm64)
    needs: release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      # The private acs repo cannot be read by the runner's GITHUB_TOKEN, so a
      # fine-grained PAT with Contents:Read on sankarru/acs must be present as
      # the ACS_REPO_TOKEN secret. Fail with a clear message rather than a bare
      # "Repository not found" from checkout.
      - name: Require ACS_REPO_TOKEN
        env:
          TOKEN: ${{ secrets.ACS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ACS_REPO_TOKEN is not set. Create a fine-grained PAT with Contents:Read on sankarru/acs and add it as a repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Checkout acs
        uses: actions/checkout@v4
        with:
          repository: sankarru/acs
          ref: ${{ inputs.acs_ref }}
          token: ${{ secrets.ACS_REPO_TOKEN }}
          path: acs
          # Never persist the PAT into .git/config of the checked-out tree.
          persist-credentials: false

      # rust-toolchain.toml pins nightly + the cranelift codegen backend (used
      # by acs's `cargo dev-build` alias). Release builds use LLVM, but rustup
      # installs the declared component regardless, so request it explicitly.
      - name: Setup Rust (nightly, matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift

      - name: Cache cargo registry
        uses: actions/cache@v4
        # Best-effort: never let a cache-quota hiccup fail the build.
        continue-on-error: true
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('acs/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      # `--config 'build.rustc-wrapper=""'` disables the sccache wrapper that
      # acs's .cargo/config.toml sets; sccache is not installed on the runner.
      # `--release` (LLVM) is the binary people actually ship, and `--locked`
      # refuses to silently re-resolve the committed Cargo.lock.
      - name: Build acs (release)
        working-directory: acs
        run: |
          cargo build --locked --release -p ca-e2e \
            --config 'build.rustc-wrapper=""'

      - name: Smoke acs
        run: |
          ./acs/target/release/acs --version
          ./acs/target/release/acs --help >/dev/null

      - name: Publish acs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            acs/target/release/acs --repo "$GITHUB_REPOSITORY" --clobber

  bundle:
    name: bundle acs + d8 + r8 (arm64)
    needs: [release, snapshot, acs]
    # Only meaningful when both snapshots were built in this run.
    if: contains(inputs.tools, 'd8') && contains(inputs.tools, 'r8')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      # One flat directory so `acs --snapshot` finds the two snapshots beside
      # the binary it was launched from (it resolves them via snapshot_home /
      # $SNAPSHOT_HOME / ~/.local/bin / PATH, and both must self-identify as
      # native-image snapshots). Result: tar out and run, no install step.
      - name: Fetch the pieces from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            -p 'd8-snapshot-arm64.tar.gz' -p 'r8-snapshot-arm64.tar.gz' -p 'acs' \
            -D dist
          tar -xzf dist/d8-snapshot-arm64.tar.gz -C dist
          tar -xzf dist/r8-snapshot-arm64.tar.gz -C dist

      - name: Assemble bundle
        run: |
          set -euo pipefail
          mkdir -p bundle
          install -m755 dist/d8-snapshot bundle/d8-snapshot
          install -m755 dist/r8-snapshot bundle/r8-snapshot
          install -m755 dist/acs         bundle/acs
          echo "--- smoke: the three binaries run ---"
          ./bundle/d8-snapshot --version
          ./bundle/r8-snapshot --version
          ./bundle/acs --version
          tar -czf acs-bundle-arm64.tar.gz -C bundle acs d8-snapshot r8-snapshot
          sha256sum acs-bundle-arm64.tar.gz > acs-bundle-arm64.tar.gz.sha256
          echo "--- bundle contents ---"
          tar -tzf acs-bundle-arm64.tar.gz
          ls -la

      - name: Publish bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            acs-bundle-arm64.tar.gz acs-bundle-arm64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  smoke-compose:
    name: smoke snapshots on compose-aot (arm64)
    needs: [release, snapshot]
    # Only meaningful when both snapshots were built in this run.
    if: contains(inputs.tools, 'd8') && contains(inputs.tools, 'r8')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool-snapshots

      - name: Checkout compose-aot
        uses: actions/checkout@v4
        with:
          repository: sankarru/compose-aot
          path: compose-aot

      - name: Setup JDK 21 (kotlinc compiler runs on any stock JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle (dependency resolution only, no build plugins)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform + build-tools (apkanalyzer needs aapt)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$ANDROID_HOME" -path "*cmdline-tools*/bin/sdkmanager" | head -1)"
          fi
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          echo "APKANALYZER=$(find "$ANDROID_HOME" -path "*cmdline-tools*/bin/apkanalyzer" | head -1)" >> "$GITHUB_ENV"

      - name: Fetch snapshots from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            -p 'd8-snapshot-arm64.tar.gz' -p 'r8-snapshot-arm64.tar.gz' \
            -D dist
          tar -xzf dist/d8-snapshot-arm64.tar.gz -C dist
          tar -xzf dist/r8-snapshot-arm64.tar.gz -C dist

      - name: Smoke snapshots over real Compose bytecode (snapshots only)
        env:
          KOTLIN_TAG: ${{ inputs.kotlin_version }}
        run: bash tool-snapshots/scripts/smoke-compose.sh

  # Promote the prerelease to a stable, "latest" release only when everything
  # that ran succeeded -- including the compose-aot end-to-end smoke.
  # install-local.sh looks up the latest stable release.
  finalize:
    name: finalize release
    needs: [release, snapshot, acs, bundle, smoke-compose]
    if: success()
    runs-on: ubuntu-24.04-arm
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "published ${{ needs.release.outputs.tag }}"
