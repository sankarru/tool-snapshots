name: tool-snapshots (GraalVM native-image of kotlinc/R8/D8)

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Tools to snapshot (comma: d8,r8,kotlinc)'
        required: true
        default: 'd8,r8'
      kotlin_version:
        description: 'Kotlin release tag (e.g. v2.2.20)'
        required: true
        default: 'v2.2.20'
      r8_version:
        description: 'R8 version from Google Maven (e.g. 8.13.23)'
        required: true
        default: '8.13.23'

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot ${{ matrix.tool }} (arm64)
    strategy:
      fail-fast: false
      matrix:
        tool: [d8, r8, kotlinc]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Filter by inputs
        id: gate
        run: |
          if [[ ",${{ inputs.tools }}," == *",${{ matrix.tool }},"* ]]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GraalVM JDK 21
        if: steps.gate.outputs.run == 'yes'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'

      - name: Setup Android SDK (D8/R8 tracing needs android.jar)
        if: steps.gate.outputs.run == 'yes' && matrix.tool != 'kotlinc'
        uses: android-actions/setup-android@v3
        with:
          # NB: the action's default package list includes the long-removed
          # "tools" package, which makes sdkmanager exit 1. List only what
          # exists; the platform install below uses sdkmanager directly.
          packages: platform-tools

      - name: Install SDK platform for tracing
        if: steps.gate.outputs.run == 'yes' && matrix.tool != 'kotlinc'
        run: |
          # setup-android does not put sdkmanager on PATH; locate it under
          # ANDROID_HOME (ANDROID_SDK_ROOT is the same dir) defensively.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path "*cmdline-tools*/bin/sdkmanager" 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKM"
          "$SDKM" "platforms;android-35"

      - name: Trace + link + smoke-test
        if: steps.gate.outputs.run == 'yes'
        env:
          TOOL: ${{ matrix.tool }}
          KOTLIN_TAG: ${{ inputs.kotlin_version }}
          R8_VERSION: ${{ inputs.r8_version }}
        run: bash scripts/snapshot.sh

      - name: Upload snapshot binary + trace metadata
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-snapshot-arm64
          path: out/
          if-no-files-found: error
          retention-days: 7

  smoke-compose:
    name: smoke snapshots on compose-aot (arm64)
    needs: snapshot
    # Only meaningful when both snapshots were built in this run.
    if: contains(inputs.tools, 'd8') && contains(inputs.tools, 'r8')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool-snapshots

      - name: Checkout compose-aot
        uses: actions/checkout@v4
        with:
          repository: sankarru/compose-aot
          path: compose-aot

      - name: Setup GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$ANDROID_HOME" -path "*cmdline-tools*/bin/sdkmanager" | head -1)"
          fi
          # Platform only: build-tools come from the fixed arm64 SDK below
          # (stock Google build-tools ship an x86_64-only aapt2 that cannot
          # start on the arm64 runner).
          "$SDKM" "platforms;android-35"
          echo "APKANALYZER=$(find "$ANDROID_HOME" -path "*cmdline-tools*/bin/apkanalyzer" | head -1)" >> "$GITHUB_ENV"

      - name: Install fixed arm64 build-tools 37.0.0
        run: |
          curl -sSfL -o /tmp/fixed-sdk.tgz \
            "https://github.com/sankarru/fixed/releases/download/v37.0.0/android-sdk-linux-arm64-complete.tar.gz"
          mkdir -p /tmp/fixed-sdk-dl "$ANDROID_HOME/build-tools"
          # tarball root is android-sdk/; merge its build-tools into the SDK.
          tar -xzf /tmp/fixed-sdk.tgz -C /tmp/fixed-sdk-dl
          cp -r /tmp/fixed-sdk-dl/android-sdk/build-tools/37.0.0 "$ANDROID_HOME/build-tools/"
          rm -rf /tmp/fixed-sdk.tgz /tmp/fixed-sdk-dl
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" version
          # AGP ignores the SDK folder for AAPT2 and downloads its own
          # (x86_64-only) copy from Maven -- force the fixed arm64 binary.
          # Written into the throwaway checkout, not committed anywhere.
          printf '\nandroid.aapt2FromMavenOverride=%s\n' \
            "$ANDROID_HOME/build-tools/37.0.0/aapt2" >> compose-aot/gradle.properties
          tail -2 compose-aot/gradle.properties

      - name: Download d8 snapshot
        uses: actions/download-artifact@v4
        with:
          name: d8-snapshot-arm64
          path: dist

      - name: Download r8 snapshot
        uses: actions/download-artifact@v4
        with:
          name: r8-snapshot-arm64
          path: dist

      - name: Build compose-aot release (JVM R8/D8 baseline)
        working-directory: compose-aot
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain --no-daemon

      - name: Smoke snapshots over real Compose bytecode
        run: bash tool-snapshots/scripts/smoke-compose.sh
