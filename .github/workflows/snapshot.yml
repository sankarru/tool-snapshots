name: tool-snapshots (GraalVM 25 native-image of R8/D8 built from source, kotlinc)

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Tools to snapshot (comma: d8,r8,kotlinc)'
        required: true
        default: 'd8,r8'
      kotlin_version:
        description: 'Kotlin release tag (e.g., v2.2.20)'
        required: true
        default: 'v2.2.20'
permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot ${{ matrix.tool }} (arm64)
    strategy:
      fail-fast: false
      matrix:
        tool: [d8, r8, kotlinc]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Filter by inputs
        id: gate
        run: |
          if [[ ",${{ inputs.tools }}," == *",${{ matrix.tool }},"* ]]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GraalVM JDK 25
        if: steps.gate.outputs.run == 'yes'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - name: Free disk (native-image link needs the room)
        if: steps.gate.outputs.run == 'yes'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/az \
                       /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          df -h / | tail -1

      - name: Setup Android SDK (the corpus needs android.jar)
        if: steps.gate.outputs.run == 'yes'
        uses: android-actions/setup-android@v3
        with:
          # NB: the action's default package list includes the long-removed
          # "tools" package, which makes sdkmanager exit 1. List only what
          # exists; the platform install below uses sdkmanager directly.
          packages: platform-tools

      - name: Install SDK platforms (android.jar)
        if: steps.gate.outputs.run == 'yes'
        run: |
          # setup-android does not put sdkmanager on PATH; locate it under
          # ANDROID_HOME (ANDROID_SDK_ROOT is the same dir) defensively.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path "*cmdline-tools*/bin/sdkmanager" 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKM"
          # android.jar only: D8/R8 are driven standalone, so no build-tools
          # and no aapt2 (Google's aapt2 is x86-64 only). android-35 is what
          # the snapshots are traced against, android-36 adds a second library
          # level for the resolution paths.
          "$SDKM" "platforms;android-35" "platforms;android-36"
          # Show what actually landed: an interrupted unpack leaves a stub
          # android.jar that later stages fail on in a very confusing way.
          ls -la "$ANDROID_HOME"/platforms/*/android.jar
          df -h / | tail -1

      - name: Build + link + smoke-test
        if: steps.gate.outputs.run == 'yes'
        env:
          TOOL: ${{ matrix.tool }}
          KOTLIN_TAG: ${{ inputs.kotlin_version }}
        run: |
          set -o pipefail
          mkdir -p "work-${{ matrix.tool }}"
          bash scripts/snapshot.sh 2>&1 | tee "work-${{ matrix.tool }}/log-snapshot.txt"

      - name: Upload build logs
        if: always() && steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-logs
          path: |
            work-${{ matrix.tool }}/log-*.txt
            work-${{ matrix.tool }}/kotlinc-corpus.log
            work-${{ matrix.tool }}/corpus/report.txt
            out/*.native-image.log
            work-${{ matrix.tool }}/smoke-*/*.txt
            work-${{ matrix.tool }}/rules/*.pro
            work-${{ matrix.tool }}/out/*-smoke-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload snapshot binary
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-snapshot-arm64
          path: |
            out/${{ matrix.tool }}-snapshot
            out/${{ matrix.tool }}-smoke-report.txt
          if-no-files-found: error
          retention-days: 7

  smoke-compose:
    name: smoke snapshots on compose-aot (arm64)
    needs: snapshot
    # Only meaningful when both snapshots were built in this run.
    if: contains(inputs.tools, 'd8') && contains(inputs.tools, 'r8')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool-snapshots

      - name: Checkout compose-aot
        uses: actions/checkout@v4
        with:
          repository: sankarru/compose-aot
          path: compose-aot

      - name: Setup JDK 25 (the kotlinc compiler runs on any stock JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle (dependency resolution only, no build plugins)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform (android.jar only; no build-tools needed)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$ANDROID_HOME" -path "*cmdline-tools*/bin/sdkmanager" | head -1)"
          fi
          "$SDKM" "platforms;android-35"
          # No build-tools: apkanalyzer needs aapt, and Google's build-tools are
          # x86_64-only binaries that cannot run on this arm64 runner. The
          # smoketest reads the dex files directly instead.

      - name: Download d8 snapshot
        uses: actions/download-artifact@v4
        with:
          name: d8-snapshot-arm64
          path: dist

      - name: Download r8 snapshot
        uses: actions/download-artifact@v4
        with:
          name: r8-snapshot-arm64
          path: dist

      - name: Smoke snapshots over real Compose bytecode (snapshots only)
        env:
          KOTLIN_TAG: ${{ inputs.kotlin_version }}
        run: bash tool-snapshots/scripts/smoke-compose.sh
