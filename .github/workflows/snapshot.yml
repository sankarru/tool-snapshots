name: tool-snapshots (GraalVM native-image of kotlinc/R8/D8)

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Tools to snapshot (comma: d8,r8,kotlinc)'
        required: true
        default: 'd8,r8'
      kotlin_version:
        description: 'Kotlin release tag (e.g. v2.2.20)'
        required: true
        default: 'v2.2.20'
      r8_version:
        description: 'R8 version from Google Maven (e.g. 8.13.23)'
        required: true
        default: '8.13.23'
      release_tag:
        description: 'Release tag to publish to (default: snapshots-<run number>)'
        required: false
        default: ''

# Binaries are published as RELEASE ASSETS, not workflow artifacts. Actions
# artifact storage is a small account-wide quota (500 MB on the Free plan) that
# this repo does not control; release assets are not metered by it. The release
# also outlives the 7-day artifact retention, which is what install-local.sh
# wants anyway.
permissions:
  contents: write

jobs:
  release:
    name: create release
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="snapshots-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            # Created as a prerelease; `finalize` promotes it to latest only when
            # every requested job succeeded, so install-local's "latest stable"
            # lookup can never pick a half-finished run.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "tool snapshots $TAG" --prerelease \
              --notes "d8/r8/kotlinc native-image snapshots. Auto-published by workflow run ${{ github.run_number }}."
          fi

  snapshot:
    name: snapshot ${{ matrix.tool }} (arm64)
    needs: release
    strategy:
      fail-fast: false
      matrix:
        tool: [d8, r8, kotlinc]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Filter by inputs
        id: gate
        run: |
          if [[ ",${{ inputs.tools }}," == *",${{ matrix.tool }},"* ]]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GraalVM JDK 25 (latest)
        if: steps.gate.outputs.run == 'yes'
        uses: graalvm/setup-graalvm@v1
        with:
          # Track the latest GraalVM (JDK 25 line). The old JDK 21 pin
          # (GraalVM 21.0.2 / jvmci-23.1) produced native images whose
          # filesystem-provider handling broke D8 on real Compose input
          # ("Provider \"jar\" not found"); JDK 25 is the known-good line.
          java-version: '25'
          distribution: 'graalvm-community'

      - name: Setup Gradle (artifact fetching only, no build plugins run)
        if: steps.gate.outputs.run == 'yes'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK (D8/R8 tracing needs android.jar)
        if: steps.gate.outputs.run == 'yes'
        uses: android-actions/setup-android@v3
        with:
          # NB: the action's default package list includes the long-removed
          # "tools" package, which makes sdkmanager exit 1. List only what
          # exists; the platform install below uses sdkmanager directly.
          packages: platform-tools

      - name: Install SDK platform for tracing
        if: steps.gate.outputs.run == 'yes'
        run: |
          # setup-android does not put sdkmanager on PATH; locate it under
          # ANDROID_HOME (ANDROID_SDK_ROOT is the same dir) defensively.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path "*cmdline-tools*/bin/sdkmanager" 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKM"
          "$SDKM" "platforms;android-35"

      - name: Trace + link + smoke-test
        if: steps.gate.outputs.run == 'yes'
        env:
          TOOL: ${{ matrix.tool }}
          KOTLIN_TAG: ${{ inputs.kotlin_version }}
          R8_VERSION: ${{ inputs.r8_version }}
        run: bash scripts/snapshot.sh

      # `out/` holds the binary and its <tool>-snapshot-meta/ directory; tar them
      # together so one release asset carries both.
      - name: Package + publish snapshot
        if: steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "${{ matrix.tool }}-snapshot-arm64.tar.gz" -C out .
          gh release upload "${{ needs.release.outputs.tag }}" \
            "${{ matrix.tool }}-snapshot-arm64.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

  smoke-compose:
    name: smoke snapshots on compose-aot (arm64)
    needs: [release, snapshot]
    # Only meaningful when both snapshots were built in this run.
    if: contains(inputs.tools, 'd8') && contains(inputs.tools, 'r8')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool-snapshots

      - name: Checkout compose-aot
        uses: actions/checkout@v4
        with:
          repository: sankarru/compose-aot
          path: compose-aot

      - name: Setup JDK 21 (kotlinc compiler runs on any stock JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle (dependency resolution only, no build plugins)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform (android.jar for d8/r8 --lib)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$ANDROID_HOME" -path "*cmdline-tools*/bin/sdkmanager" | head -1)"
          fi
          "$SDKM" "platforms;android-35"

      - name: Fetch snapshots from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            -p 'd8-snapshot-arm64.tar.gz' -p 'r8-snapshot-arm64.tar.gz' \
            -D dist
          tar -xzf dist/d8-snapshot-arm64.tar.gz -C dist
          tar -xzf dist/r8-snapshot-arm64.tar.gz -C dist

      - name: Smoke snapshots over real Compose bytecode (snapshots only)
        env:
          KOTLIN_TAG: ${{ inputs.kotlin_version }}
        run: bash tool-snapshots/scripts/smoke-compose.sh

  # Promote the prerelease to a stable, "latest" release only when everything
  # that ran succeeded -- including the compose-aot end-to-end smoke.
  # install-local.sh looks up the latest stable release.
  finalize:
    name: finalize release
    needs: [release, snapshot, smoke-compose]
    if: success()
    runs-on: ubuntu-24.04-arm
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "published ${{ needs.release.outputs.tag }}"
